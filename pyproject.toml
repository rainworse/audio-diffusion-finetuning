[project]
name = "audio-diffusion-finetuning"
version = "0.1.0"
description = "Finetuning a diffusion based audio model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops>=0.8.1",
    "notebook>=7.5.6",
    "torch>=2.11.0",
    "stable-audio-tools>=0.0.19",
    "torchaudio",
    "transformers>=4.51.0,<4.58.0",
    "soundfile>=0.13.1",
    "torchcodec>=0.12.0",
    "tqdm>=4.67.3",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = [{ index = "pytorch-cu126" }]
